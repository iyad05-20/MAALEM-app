services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      - PORT=3000
      - NODE_ENV=production
    env_file:
      - apps/backend/.env
    ports:
      - "3001:3000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - VITE_BACKEND_URL=/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
